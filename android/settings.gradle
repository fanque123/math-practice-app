// 安卓壳工程：把网页打包成可离线安装的 APK
// google 的 maven 源在国内被墙，优先走阿里云镜像
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
        // sherpa-onnx 的 AAR 在镜像拉不到，放 app/libs/ 本地引用
        //（不能配在 app/build.gradle：模块级 repositories 会整体覆盖这里的仓库，导致 aapt2 都拉不到）
        flatDir { dirs 'app/libs' }
    }
}
rootProject.name = "math-practice"
include ':app'
